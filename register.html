<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supabase Register</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script type="module" src="js/register.js"></script>
  </head>
  <body>
    <header
      class="sticky top-0 z-30 flex justify-between items-center p-5 shadow-md bg-white"
    >
      <a href="index.html" class="font-medium text-2xl">Supabase</a>
      <nav>
        <a href="register.html" class="font-medium">Register</a>
        <a href="login.html" class="font-medium pl-3">Login</a>
      </nav>
    </header>
    <main class="min-h-screen">
      <div>
        <h1 class="text-center text-2xl pt-30">Create a new account</h1>
        <form class="mx-auto flex flex-col max-w-md p-10">
          <p
            id="formError"
            class="my-2 hidden rounded border border-red-700 bg-red-100 p-3 text-red-700"
          ></p>
          <p
            id="formSuccess"
            class="my-2 hidden rounded border border-green-700 bg-green-100 p-3 text-green-700"
          ></p>

          <div class="flex flex-col">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              required
              placeholder="example@email.com"
              class="h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
            />
          </div>

          <div class="flex flex-col">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              required
              minlength="6"
              class="h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
            />
          </div>

          <button
            id="submit"
            type="submit"
            class="bg-blue-900 font-heading mt-7 h-12 rounded-sm text-center font-medium text-white shadow-lg"
          >
            Submit
          </button>
        </form>
      </div>
    </main>
  </body>
</html>
