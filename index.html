<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supabase Home</title>
    <script
      src="https://kit.fontawesome.com/ec3d7ec6ab.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./css/style.css" />
    <script type="module" src="js/news.js"></script>
  </head>
  <body>
    <header
      class="sticky top-0 z-30 flex justify-between items-center p-5 shadow-md bg-white"
    >
      <a href="index.html" class="font-medium text-2xl">Supabase</a>
      <nav id="nav1" class="hidden">
        <a href="register.html" class="font-medium">Register</a>
        <a href="login.html" class="font-medium pl-3">Login</a>
      </nav>
      <nav id="nav2" class="hidden">
        <button
          id="logout-btn"
          class="bg-blue-900 text-white rounded-md shadow-md px-3 py-1 font-medium"
        >
          Logout
        </button>
      </nav>
    </header>
    <main class="min-h-screen">
      <div class="mx-auto max-w-md lg:max-w-1/2 px-5">
        <button
          id="create-link"
          class="text-center font-medium text-blue-900 pt-5"
        >
          Create a new post
        </button>
        <section
          id="create-section"
          class="hidden bg-gray-100 shadow-md rounded-md max-w-full mx-auto mb-10 mt-5"
        >
          <form class="mx-auto flex flex-col max-w-full p-5">
            <p
              id="formError"
              class="my-2 hidden rounded border border-red-700 bg-red-100 p-3 text-red-700"
            ></p>
            <p
              id="formSuccess"
              class="my-2 hidden rounded border border-green-700 bg-green-100 p-3 text-green-700"
            ></p>

            <div class="flex flex-col">
              <label for="title">Title</label>
              <input
                id="title"
                name="title"
                type="title"
                required
                class="h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
              />
            </div>

            <div class="flex flex-col">
              <label for="content">Content</label>
              <textarea
                id="content"
                name="content"
                required
                class="field-sizing-content min-h-20 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
              ></textarea>
            </div>

            <button
              id="submit"
              type="submit"
              class="bg-blue-900 font-heading mt-7 h-12 rounded-sm text-center font-medium text-white shadow-lg"
            >
              Submit
            </button>
          </form>
        </section>
      </div>

      <div
        id="news-list"
        class="px-5 grid grid-cols-1 lg:grid-cols-2 gap-5 max-w-md lg:max-w-1/2 mx-auto mb-20 mt-5"
      ></div>
    </main>
  </body>
</html>
